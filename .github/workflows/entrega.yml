name: Entrega Continua

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  entrega:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verificar pruebas antes de empaquetar
        run: |
          pip install -r requirements.txt
          pytest -q

      - name: Preparar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: TaskManager-${{ github.event.release.tag_name || 'manual' }}
          path: |
            app.py
            requirements.txt
            templates/
            static/
            README.md

      - name: Adjuntar paquete al Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          zip -r "TaskManager-${TAG}.zip" app.py requirements.txt templates static README.md
          gh release upload "$TAG" "TaskManager-${TAG}.zip" --clobber
