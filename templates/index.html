<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskManager · TechSolutions</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="encabezado">
    <div class="contenedor encabezado-contenido">
      <div>
        <h1 class="logo">Task<span>Manager</span></h1>
        <p class="subtitulo">Gestión centralizada de tareas · TechSolutions</p>
      </div>
      <span class="version">v{{ version }}</span>
    </div>
  </header>

  <main class="contenedor">
    <section class="resumen" aria-label="Resumen de tareas">
      <div class="contador"><span id="total-todas">0</span><small>Total</small></div>
      <div class="contador pendiente"><span id="total-pendiente">0</span><small>Pendientes</small></div>
      <div class="contador en-proceso"><span id="total-en-proceso">0</span><small>En proceso</small></div>
      <div class="contador terminada"><span id="total-terminada">0</span><small>Terminadas</small></div>
    </section>

    <div class="diseno">
      <section class="panel" aria-labelledby="titulo-formulario">
        <h2 id="titulo-formulario">Nueva tarea</h2>
        <form id="formulario-tarea" novalidate>
          <label for="nombre">Nombre de la tarea <abbr title="obligatorio">*</abbr></label>
          <input id="nombre" name="nombre" type="text" maxlength="120"
                 placeholder="Ej. Elaborar documentación" autocomplete="off">
          <p class="error-campo" id="error-nombre" role="alert"></p>

          <label for="descripcion">Descripción</label>
          <textarea id="descripcion" name="descripcion" rows="3" maxlength="1000"
                    placeholder="Detalles de la actividad (opcional)"></textarea>

          <div class="fila-campos">
            <div>
              <label for="prioridad">Prioridad</label>
              <select id="prioridad" name="prioridad">
                {% for p in prioridades %}
                <option value="{{ p }}" {% if p == 'Media' %}selected{% endif %}>{{ p }}</option>
                {% endfor %}
              </select>
            </div>
            <div>
              <label for="estado">Estado</label>
              <select id="estado" name="estado">
                {% for e in estados %}
                <option value="{{ e }}">{{ e }}</option>
                {% endfor %}
              </select>
            </div>
          </div>

          <div class="acciones-formulario">
            <button type="submit" class="boton primario" id="boton-guardar">Guardar tarea</button>
            <button type="button" class="boton" id="boton-cancelar" hidden>Cancelar edición</button>
          </div>
        </form>
      </section>

      <section class="panel" aria-labelledby="titulo-listado">
        <div class="listado-cabecera">
          <h2 id="titulo-listado">Tareas registradas</h2>
        </div>
        <ul id="lista-tareas" class="lista-tareas" aria-live="polite"></ul>
        <p id="sin-tareas" class="vacio" hidden>No hay tareas para mostrar.</p>
      </section>
    </div>
  </main>

  <div id="mensaje" class="mensaje" role="status" aria-live="polite" hidden></div>

  <footer class="pie">
    <div class="contenedor">TaskManager v{{ version }} · Proyecto DevOps con GitHub</div>
  </footer>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
