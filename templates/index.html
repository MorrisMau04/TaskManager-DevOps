<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskManager · TechSolutions</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="encabezado">
    <div class="contenedor encabezado-contenido">
      <div>
        <h1 class="logo">Task<span>Manager</span></h1>
        <p class="subtitulo">Gestión centralizada de tareas · TechSolutions</p>
      </div>
      <span class="version">v{{ version }}</span>
    </div>
  </header>

  <main class="contenedor">
    <p class="vacio">La aplicación está en construcción.</p>
  </main>

  <div id="mensaje" class="mensaje" role="status" aria-live="polite" hidden></div>

  <footer class="pie">
    <div class="contenedor">TaskManager v{{ version }} · Proyecto DevOps con GitHub</div>
  </footer>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
